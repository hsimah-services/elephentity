[package]
name = "eleph-compiler"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The Elephentity spec compiler"

[lib]
name = "eleph_compiler"
path = "src/lib.rs"

[[bin]]
name = "eleph"
path = "src/main.rs"

[dependencies]
# YAML with source spans and mapping order. serde_yaml is unmaintained and is not used.
saphyr = "0.2"
saphyr-parser = "0.2"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
jsonschema = { version = "0.58", default-features = false }
regex = "1"
clap = { version = "4", features = ["derive"] }
# `eleph install`: download a release, check its digest, unpack the one binary in it. Blocking
# and synchronous on purpose; this is a command line, and nothing here is concurrent.
ureq = "2"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
