name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - uses: dtolnay/rust-toolchain@stable
      - name: Build generators
        run: |
          cargo build --release --locked --manifest-path vendor/elephentity/codegen/Cargo.toml
          cargo build --release --locked --manifest-path vendor/elephentity/codegen-php/Cargo.toml
      - run: composer ci
      - run: php bin/eleph --version
