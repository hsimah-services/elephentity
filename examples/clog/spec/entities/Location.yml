entity: Location
description: Somewhere inventory can be kept.
use:
  - ClogPost
configure:
  ClogPost:
    visibility: private
    adminMenu: clog
    label: Location
    pluralLabel: Locations
integrations:
  wpgraphql:
    singular: ClogLocation
    plural: ClogLocations
storage:
  table: location
  handle: clog_location
fields:
  name:
    type: string
    description: What the location is called. Projected to post_title.
    required: true
    unique: true
    maxLength: 200
edges:
  sites:
    to: Site
    cardinality: many
    description: >
      Which buildings this kind of storage exists in — Deep Freezer might list only
      Cave, where Pantry lists both. Inventory.site is checked against this list on
      write, so an entry can never claim a combination this edge does not allow.
