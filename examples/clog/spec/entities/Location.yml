entity: Location
description: Somewhere inventory can be kept.
use:
  - ClogPost
configure:
  ClogPost:
    visibility: private
    adminMenu: clog
    label: Location
    pluralLabel: Locations
storage:
  table: location
  handle: clog_location
fields:
  name:
    type: string
    description: What the location is called. Projected to post_title.
    required: true
    unique: true
    maxLength: 200
