entity: Inventory
description: One stocked instance of an item, in a location, with its own expiry.
use:
  - ClogPost
configure:
  ClogPost:
    visibility: private
    adminMenu: clog
    label: Inventory Entry
    pluralLabel: Inventory
integrations:
  wpgraphql:
    singular: ClogInventory
    plural: ClogInventoryEntries
storage:
  table: inventory
  handle: clog_inventory
fields:
  name:
    type: string
    description: Projected to post_title, so the admin list has something to show.
    required: true
    maxLength: 200
  dateAdded:
    type: datetime
    description: When this instance entered inventory.
    required: true
  dateExpiry:
    type: datetime
    description: When it expires. Absent means it does not.
    nullable: true
edges:
  item:
    to: Item
    cardinality: one
    description: What this entry is an instance of.
    inverse:
      name: inventoryEntries
      unique: false
    onDelete: cascade
  location:
    to: Location
    cardinality: one
    description: Where it is kept.
    inverse:
      name: inventoryEntries
      unique: false
  site:
    to: Site
    cardinality: many
    description: >
      Which building this instance is physically in. Many-to-many because that is
      the only relation Elephentity's WordPress driver stores as a taxonomy term
      rather than a column; an entry moving between buildings relinks this edge
      instead of becoming a different row.
triggers:
  siteAvailability:
    description: >
      Rejects a write whose site is not one of its location's available sites — Deep
      Freezer lists only Cave, so an entry there can never claim the Loft.
    on: [create, update]
    phase: preCommit
    handler: true
