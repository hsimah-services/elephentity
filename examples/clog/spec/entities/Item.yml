entity: Item
description: A thing that can be stocked, identified by its barcode.
use:
  - ClogPost
configure:
  ClogPost:
    visibility: private
    adminMenu: clog
    label: Item
    pluralLabel: Items
integrations:
  wpgraphql:
    singular: ClogItem
    plural: ClogItems
storage:
  table: item
  handle: clog_item
fields:
  name:
    type: string
    description: What the item is called. Projected to post_title.
    required: true
    indexed: true
    maxLength: 200
  barcode:
    type: string
    description: >
      The barcode that identifies this item. One per item: a serialized list could
      not be indexed, and scanning a barcode to find an item is the query this data
      exists to serve.
    nullable: true
    unique: true
    maxLength: 64
  defaultExpiryUnit:
    type: enum
    description: Half of the default expiry; meaningless without the other half.
    nullable: true
    values: ExpiryUnit
    verify: true
  defaultExpiryValue:
    type: int
    description: Half of the default expiry; meaningless without the other half.
    nullable: true
    verify: true
queries:
  search:
    description: Items whose name or barcode matches a term, for the table's filter box.
    args:
      term: { type: string }
    returns:
      type: Item
      cardinality: many
    integrations:
      wpgraphql:
        field: clogItemSearch
    handler: true
