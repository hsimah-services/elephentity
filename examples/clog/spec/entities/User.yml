entity: User
description: >
  The WordPress account behind clog activity. Its rows are wp_users accounts, not
  new data Clog owns: no wp_posts projection, no admin menu entry, and no table of
  its own — see ClogPost's account: true. Its id is the same wp_users.ID a Viewer
  resolves to, by construction, so no bridge field and no manual lookup are needed
  to ask "is this row the current viewer".
use:
  - ClogPost
configure:
  ClogPost:
    account: true
storage:
  table: user
fields:
  bio:
    type: string
    description: A short note staff can see on this account's profile.
    nullable: true
