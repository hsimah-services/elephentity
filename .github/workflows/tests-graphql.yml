name: Tests graphql

on:
  push:
    branches: [main]
    paths:
      - 'packages/graphql/**'
      - 'packages/runtime/**'
      - 'tools/family-version'
      - '.github/workflows/tests-graphql.yml'
  pull_request:
    paths:
      - 'packages/graphql/**'
      - 'packages/runtime/**'
      - 'tools/family-version'
      - '.github/workflows/tests-graphql.yml'

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/graphql
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring
          coverage: none
          tools: composer:v2
      # The adaptor is tested against the runtime in this commit, not the last one on Packagist, so
      # a runtime change that breaks it fails here. A pull request checkout has no branch for
      # Composer to read a version from, so the version comes from tools/family-version.
      - name: Resolve the runtime from this checkout
        run: |
          version="$(../../tools/family-version)"
          composer config repositories.runtime "{\"type\":\"path\",\"url\":\"../runtime\",\"options\":{\"versions\":{\"elephentity/runtime\":\"$version\"}}}"
      - uses: ramsey/composer-install@v3
        with:
          working-directory: packages/graphql
      - run: composer test
