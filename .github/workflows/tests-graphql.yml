name: Tests graphql

on:
  push:
    branches: [main]
    paths:
      - 'packages/graphql/**'
      - '.github/workflows/tests-graphql.yml'
  pull_request:
    paths:
      - 'packages/graphql/**'
      - '.github/workflows/tests-graphql.yml'

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/graphql
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
        with:
          working-directory: packages/graphql
      - run: composer test
