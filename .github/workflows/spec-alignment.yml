name: Spec alignment

# Advisory, on the pull request, and never blocking.
#
# Documentation drifting from the thing it documents is an unsolved human problem, and
# an md file describing an entity is no exception. Rather than pretend otherwise, this
# leaves a comment while the author is still looking at the diff — post-merge would
# mean the drift is already in main and whoever caused it has moved on.
#
# The agent is asked to enumerate, not to judge. "Are these aligned?" produces an
# opinion nobody can check; "list the fields in the yaml with no counterpart in the md"
# produces a list where a false positive is obvious at a glance.
#
# ---
#
# **This is a project gate, not a framework gate, so it does not run here.** Specs live
# in projects that use Elephentity; this repository has none — only the worked example
# and the compiler's test fixtures, several of which are deliberately malformed. Wired
# to `pull_request` it fired on any markdown edit and had nothing valid to compare.
#
# It is `workflow_call` instead, so a project can adopt it in one line:
#
#     jobs:
#       alignment:
#         uses: hsimah-services/elephentity/.github/workflows/spec-alignment.yml@main
#         with:
#           specs: spec
#         secrets: inherit
#
# Or copy this file and change the trigger back to `pull_request` — which is what a
# project with a different layout will want anyway. See docs/CI.md.

on:
  workflow_call:
    inputs:
      specs:
        description: The directory holding the specs and their descriptions.
        type: string
        required: false
        default: spec
    secrets:
      ANTHROPIC_API_KEY:
        description: Absent is fine; the check skips rather than failing.
        required: false

permissions:
  contents: read
  pull-requests: write
  # The action authenticates over OIDC when no key is supplied, and cannot mint a token
  # without this. Its absence is not reported as a permissions problem, so it is worth
  # keeping even when a key is set.
  id-token: write

jobs:
  alignment:
    name: Compare specs against their descriptions
    runs-on: ubuntu-latest

    # Advisory means advisory: a red tick on a check nobody agreed to be blocked by is
    # how an advisory gate gets switched off within a week.
    continue-on-error: true

    env:
      # A fork's pull request gets no secrets, so this covers that case too: the check
      # skips instead of failing on something it was never going to have.
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect changed specs
        id: changed
        if: env.HAS_KEY == 'true'
        run: |
          {
            echo 'files<<EOF'
            git diff --name-only "origin/${{ github.base_ref }}"... \
              -- "${{ inputs.specs }}" | grep -E '\.(yml|md)$' || true
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Ask for an enumeration, not an opinion
        if: env.HAS_KEY == 'true' && steps.changed.outputs.files != ''
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            For each entity spec changed in this pull request, compare the .yml against
            its companion .md and report exactly two lists:

            1. Fields, edges, queries, actions and triggers present in the yaml with no
               counterpart described in the md.
            2. Statements in the md describing behaviour that the yaml does not declare.

            Report only those two lists. Do not judge whether the description reads
            well, do not suggest wording, and do not comment on the code. If both lists
            are empty for every changed spec, say so in one line and stop.

            Changed files:
            ${{ steps.changed.outputs.files }}
