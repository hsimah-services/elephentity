name: CI codegen-csharp

on:
  push:
    branches: [main]
    paths:
      - 'builders/codegen-csharp/**'
      - '.github/workflows/ci-codegen-csharp.yml'
      - 'dotnet/**'
  pull_request:
    paths:
      - 'builders/codegen-csharp/**'
      - '.github/workflows/ci-codegen-csharp.yml'
      - 'dotnet/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Rust
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: builders/codegen-csharp

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Formatting
        run: cargo +stable fmt --check

      - name: Static analysis
        run: cargo +stable clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo +stable test --locked

      - name: The launcher parses
        run: sh -n bin/eleph-gen-csharp

  generated:
    name: Generated C# compiles and runs
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: builders/codegen-csharp

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: builders/codegen-csharp/tests/dotnet/global.json

      - name: The runtime the golden trees are built against
        run: |
          mkdir -p tests/dotnet/.deps
          cp -R ../../dotnet tests/dotnet/.deps/elephentity-dotnet

      - name: Build the builder
        run: cargo +stable build --locked

      - name: Write the golden trees out
        run: python3 tests/dotnet/materialize.py

      - name: Compile them and run the memory-driver tests
        run: dotnet run --project tests/dotnet -c Release
