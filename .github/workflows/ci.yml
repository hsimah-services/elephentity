name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dotnet/**'
      - 'builders/**'
      - 'packages/graphql/**'
      - 'packages/sqlite/**'
      - 'patterns/**'
  pull_request:
    paths-ignore:
      - 'dotnet/**'
      - 'builders/**'
      - 'packages/graphql/**'
      - 'packages/sqlite/**'
      - 'patterns/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Rust compiler is measured against snapshots of the retired PHP compiler, frozen under
  # compiler/tests/oracle, so this job needs no PHP.
  compiler:
    name: Rust compiler
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Formatting
        run: cargo +stable fmt --check --manifest-path compiler/Cargo.toml

      - name: Static analysis
        run: cargo +stable clippy --locked --all-targets --manifest-path compiler/Cargo.toml -- -D warnings

      - name: Tests
        run: cargo +stable test --locked --manifest-path compiler/Cargo.toml

  # These are the framework's own gates. The spec gates Elephentity provides — `validate`,
  # `generate --check`, `fmt --check` and conformance — run in the CI of projects that
  # use Elephentity, against their specs; here they are exercised by the test suite instead.
  build:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.3 is the floor. 8.4 runs to catch forward-compatibility breaks early.
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal

      - name: Build generators
        run: |
          cargo +stable build --release --locked --manifest-path vendor/elephentity/codegen/Cargo.toml
          cargo +stable build --release --locked --manifest-path vendor/elephentity/codegen-php/Cargo.toml

      - name: Code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --show-progress=none

      - name: Static analysis
        run: composer stan -- --no-progress

      - name: Architecture rules
        run: composer arch

      - name: Tests
        run: vendor/bin/phpunit

      - name: The builders accept the IR the Rust compiler produces
        run: tools/test-rust-ir


      - name: Deletion policies against SQLite
        env:
          ELEPH_SQLITE_SOURCE: ${{ github.workspace }}/packages/sqlite/src
        run: vendor/bin/phpunit --bootstrap tools/integration/sqlite-bootstrap.php tools/integration/DeletionPlannerSQLiteTest.php

      - name: Standalone package installation
        run: tools/test-package-install.sh
