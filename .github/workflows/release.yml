name: Release

# On a v* tag: build `eleph` for linux-x64, linux-arm64, osx-arm64 and win-x64, check the
# archives, publish them with SHA256SUMS to the tag's GitHub Release, and attach the two scripts
# that bootstrap it (install.sh, install.ps1).
#
# The build, the checks and the archive names are release-binary.yml, the reusable workflow every
# Rust program here shares; the names are a contract with `eleph install`
# (docs/RELEASING.md). Called from a branch or a pull request it publishes
# nothing, which is how release-check.yml proves a change to this path without a tag.
#
# A `v*` tag releases the eleph binary only. The Composer packages are released by `php-v*` and
# the builders' own tags (split.yml); eleph does not touch Composer.
#
# Tags: `v<version>` releases eleph; `<binary>-v<version>` releases that builder (for example
# `eleph-gen-csharp-v0.1.0`). Each program is versioned on its own.

on:
  push:
    tags:
      - 'v*'
      - 'eleph-codegen-v*'
      - 'eleph-gen-tsquid-v*'
      - 'eleph-gen-sqlite-v*'
      - 'eleph-gen-csharp-v*'
      - 'eleph-gen-cosmos-v*'
      - 'eleph-gen-graphql-csharp-v*'

permissions:
  contents: write

jobs:
  binary:
    if: startsWith(github.ref_name, 'v')
    uses: ./.github/workflows/release-binary.yml
    with:
      binary: eleph
      manifest-path: compiler/Cargo.toml

  eleph-codegen:
    if: startsWith(github.ref_name, 'eleph-codegen-v')
    uses: ./.github/workflows/release-binary.yml
    with:
      binary: eleph-codegen
      manifest-path: builders/codegen/Cargo.toml

  eleph-gen-tsquid:
    if: startsWith(github.ref_name, 'eleph-gen-tsquid-v')
    uses: ./.github/workflows/release-binary.yml
    with:
      binary: eleph-gen-tsquid
      manifest-path: builders/codegen-tsquid/Cargo.toml

  eleph-gen-sqlite:
    if: startsWith(github.ref_name, 'eleph-gen-sqlite-v')
    uses: ./.github/workflows/release-binary.yml
    with:
      binary: eleph-gen-sqlite
      manifest-path: builders/codegen-sqlite/Cargo.toml

  eleph-gen-csharp:
    if: startsWith(github.ref_name, 'eleph-gen-csharp-v')
    uses: ./.github/workflows/release-binary.yml
    with:
      binary: eleph-gen-csharp
      manifest-path: builders/codegen-csharp/Cargo.toml

  eleph-gen-cosmos:
    if: startsWith(github.ref_name, 'eleph-gen-cosmos-v')
    uses: ./.github/workflows/release-binary.yml
    with:
      binary: eleph-gen-cosmos
      manifest-path: builders/codegen-cosmos/Cargo.toml

  eleph-gen-graphql-csharp:
    if: startsWith(github.ref_name, 'eleph-gen-graphql-csharp-v')
    uses: ./.github/workflows/release-binary.yml
    with:
      binary: eleph-gen-graphql-csharp
      manifest-path: builders/codegen-graphql-csharp/Cargo.toml

  scripts:
    if: startsWith(github.ref_name, 'v')
    name: Attach install scripts
    needs: binary
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Check the scripts parse
        run: |
          sh -n install.sh
          # PowerShell is on the runner; a script that does not parse should not be published.
          pwsh -NoProfile -Command '$e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$e); if ($e.Count) { $e; exit 1 }'

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" install.sh install.ps1 --clobber --repo "$GITHUB_REPOSITORY"
