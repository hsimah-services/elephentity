name: Subtree split

# Mirrors packages that are published as their own Composer package out to read-only
# repositories. Runtime, schema, CLI and memory are independently installable.
#
# Runs on push to main (keeps each mirror's `src/`+`tests/` current) and on tags (tags
# the mirror's own main at whatever it synced to, matching this repository's tag line
# — a mirror is not an independently-versioned product, see .llms/cross-repo.md).
#
# Runtime retains its existing mirror-owned tooling and Composer metadata. New schema,
# CLI and memory mirrors copy the whole package, including resources, bins and CI.
# Tag runs synchronize the tagged source revision too, avoiding tags on stale mirrors.
#
# Requires a secret named SPLIT_PUSH_TOKEN: a token with push access to every mirror
# repository listed below. The default GITHUB_TOKEN cannot push to another repository,
# and actions/checkout's own persisted credentials silently shadow it if not disabled
# (persist-credentials: false, below) — both steps are load bearing.

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: package-mirrors
  cancel-in-progress: false

jobs:
  split:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: runtime
            repo: hsimah-services/elephentity-runtime
          - package: schema
            repo: hsimah-services/elephentity-schema
          - package: cli
            repo: hsimah-services/elephentity-cli
          - package: memory
            repo: hsimah-services/elephentity-memory

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          path: source

      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          fetch-depth: 0
          token: ${{ secrets.SPLIT_PUSH_TOKEN }}
          persist-credentials: true
          path: mirror

      - name: Sync package into the mirror
        run: |
          set -euo pipefail
          if [ "${{ matrix.package }}" = runtime ]; then
            # The existing runtime mirror owns its tooling and Composer metadata.
            rsync -a --delete source/packages/runtime/src/ mirror/src/
            rsync -a --delete source/packages/runtime/tests/ mirror/tests/
          else
            # New mirrors are wholly source-owned, including resources, bins and CI.
            rsync -a --delete --exclude=.git --exclude=vendor --exclude=composer.lock \
              --exclude=.phpunit.cache --exclude=.phpunit.result.cache \
              "source/packages/${{ matrix.package }}/" mirror/
          fi

          cd mirror
          git config user.name "elephentity-bot"
          git config user.email "noreply@elephentity.dev"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to sync."
            exit 0
          fi

          git commit -m "Sync package from elephentity@${GITHUB_SHA}

          Automated: packages/${{ matrix.package }} in elephentity.
          Runtime tooling stays mirror-owned; other package metadata is source-owned."
          git push origin main

      - name: Tag the mirror to match
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          cd mirror
          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)"
          else
            git tag "$tag"
            git push origin "$tag"
          fi
