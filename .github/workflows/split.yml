name: Subtree split

# Mirrors packages that are published as their own Composer package out to read-only
# repositories, so `elephentity/runtime` (and later `/schema`, `/cli`, `/memory` —
# elephentity#63) is installable without the rest of this repository along with it.
#
# Runs on push to main (keeps each mirror's `src/`+`tests/` current) and on tags (tags
# the mirror's own main at whatever it synced to, matching this repository's tag line
# — a mirror is not an independently-versioned product, see .llms/cross-repo.md).
#
# Syncs only src/ and tests/. Everything else on the mirror — composer.json, docs, its
# own CI, tools/, .llms/ — is that repository's own, never touched here. The mirror
# needs a working composer.json (require-dev tools, scripts) and a CI workflow of its
# own to be buildable at all, and neither exists under packages/runtime/ here for a
# subtree split to carry over. An earlier version of this workflow force-pushed the
# raw split as the mirror's entire main and silently deleted all of that on the first
# run after it landed — this is the fix. packages/runtime/composer.json's own
# `require` block is NOT synced either: port dependency changes there by hand, per the
# matching row in .llms/cross-repo.md.
#
# Requires a secret named SPLIT_PUSH_TOKEN: a token with push access to every mirror
# repository listed below. The default GITHUB_TOKEN cannot push to another repository,
# and actions/checkout's own persisted credentials silently shadow it if not disabled
# (persist-credentials: false, below) — both steps are load bearing.

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  split:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: runtime
            repo: hsimah-services/elephentity-runtime

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          path: source

      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.SPLIT_PUSH_TOKEN }}
          persist-credentials: true
          path: mirror

      - name: Sync src/ and tests/ into the mirror
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          rm -rf "mirror/src" "mirror/tests"
          cp -r "source/packages/${{ matrix.package }}/src" "mirror/src"
          cp -r "source/packages/${{ matrix.package }}/tests" "mirror/tests"

          cd mirror
          git config user.name "elephentity-bot"
          git config user.email "noreply@elephentity.dev"
          git add src tests

          if git diff --cached --quiet; then
            echo "Nothing to sync."
            exit 0
          fi

          git commit -m "Sync src/ and tests/ from elephentity@${GITHUB_SHA}

          Automated: packages/${{ matrix.package }} in elephentity.
          composer.json and everything else here is this repository's own."
          git push origin main

      - name: Tag the mirror to match
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          cd mirror
          git tag "$tag"
          git push origin "$tag"
