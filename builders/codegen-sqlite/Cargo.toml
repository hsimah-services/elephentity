[package]
name = "elephentity-codegen-sqlite"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Elephentity SQLite storage manifest and initial schema builder"

[[bin]]
name = "eleph-gen-sqlite"
path = "rust/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
