"""Someone who writes comments."""
type Author implements Node {
  comments(after: String, before: String, first: Int, last: Int): AuthorToCommentConnection

  """
  The row as storage knows it, unique within its table rather than the schema.
  """
  databaseId: ID!

  """The globally unique identifier, opaque and safe to use as a cache key."""
  id: ID!

  """"""
  name: String!

  """The Post pointing here through "featuredAuthor"."""
  post: Post
}

type AuthorToCommentConnection {
  edges: [AuthorToCommentConnectionEdge]
  nodes: [Comment]
  pageInfo: PageInfo!

  """How many match, ignoring pagination."""
  totalCount: Int
}

type AuthorToCommentConnectionEdge {
  cursor: String
  node: Comment
}

