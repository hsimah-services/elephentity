  id: ID!

  """"""
  postId: Int

  """"""
  price: Int

  """When it went live. A plain datetime, set by whoever publishes it."""
  publishedAt: String
  related(after: String, before: String, first: Int, last: Int): PostToPostConnection
  relatedFrom(after: String, before: String, first: Int, last: Int): PostToPostConnection

  """Write-once, and chosen by whoever creates the post."""
  slug: String!

  """"""
  status: PostStatus!
  tags(after: String, before: String, first: Int, last: Int): PostToTagConnection

  """"""
  title: String!

  """When the row was last written. Filled by the framework."""
