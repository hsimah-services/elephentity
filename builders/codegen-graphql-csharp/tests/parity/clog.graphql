"""One stocked instance of an item, in a location, with its own expiry."""
type ClogInventory implements Node {
  """When the row was first written. Filled by the framework."""
  createdAt: String!

  """
  The row as storage knows it, unique within its table rather than the schema.
  """
  databaseId: ID!

  """When this instance entered inventory."""
  dateAdded: String!

  """When it expires. Absent means it does not."""
  dateExpiry: String

  """The globally unique identifier, opaque and safe to use as a cache key."""
  id: ID!

  """What this entry is an instance of."""
  item: ClogItem

  """Where it is kept."""
  location: ClogLocation

  """Projected to post_title, so the admin list has something to show."""
  name: String!

  "The wp_posts row this entity projects to, once something creates one. Nullable because nothing in the framework writes it: an entity exists in its own table whether or not a post row was ever made for it.\n"
  postId: Int
  site(after: String, before: String, first: Int, last: Int): ClogInventoryToClogSiteConnection

  """When the row was last written. Filled by the framework."""
  updatedAt: String!
}

type ClogInventoryToClogSiteConnection {
  edges: [ClogInventoryToClogSiteConnectionEdge]
