  pageInfo: PageInfo!

  """How many match, ignoring pagination."""
  totalCount: Int
}

type ClogInventoryToClogSiteConnectionEdge {
  cursor: String
  node: ClogSite
}

"""A thing that can be stocked, identified by its barcode."""
type ClogItem implements Node {
  "The barcode that identifies this item. One per item: a serialized list could not be indexed, and scanning a barcode to find an item is the query this data exists to serve.\n"
  barcode: String

  """When the row was first written. Filled by the framework."""
  createdAt: String!

  """
  The row as storage knows it, unique within its table rather than the schema.
  """
  databaseId: ID!

  """Half of the default expiry; meaningless without the other half."""
  defaultExpiryUnit: ExpiryUnit

  """Half of the default expiry; meaningless without the other half."""
  defaultExpiryValue: Int

  """The globally unique identifier, opaque and safe to use as a cache key."""
  id: ID!
  inventoryEntries(after: String, before: String, first: Int, last: Int): ClogItemToClogInventoryConnection

  """What the item is called. Projected to post_title."""
  name: String!

  "The wp_posts row this entity projects to, once something creates one. Nullable because nothing in the framework writes it: an entity exists in its own table whether or not a post row was ever made for it.\n"
  postId: Int

  """When the row was last written. Filled by the framework."""
  updatedAt: String!
}

type ClogItemToClogInventoryConnection {
  edges: [ClogItemToClogInventoryConnectionEdge]
