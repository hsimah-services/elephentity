[package]
name = "elephentity-codegen-graphql-csharp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Generate the Elephentity.GraphQL manifest from the versioned schema IR"

[[bin]]
name = "eleph-gen-graphql-csharp"
path = "rust/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
sha2 = "0.10"
